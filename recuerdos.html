<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<style>

body {
    background-color: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    margin: 0;
    padding: 20px;
}

h1 {
    font-size: 45px;
    letter-spacing: 5px;
}

h2 {
    font-size: 28px;
}

p {
    font-size: 20px;
}

.caja {
    max-width: 700px;
    margin: auto;

}

input, textarea {
    width: 90%;
    padding: 12px;
    margin: 10px;
    background: #222;
    color: white;
    border: 1px solid #555;
}

textarea {
    height: 120px;
}

button {
    padding: 15px 30px;

    color: black;
    border: none;
    font-weight: bold;
}

</head>

<body>

<div class="caja">

<h1>LIBRO DE RECUERDOS</h1>

<p>
Dejanos un saludo, un recuerdo, alguna anécdota o lo que quieras.
</p>

<p>
Fuiste parte de la historia de Reactor.
</p>

<hr>

<h2>Tu recuerdo</h2>

<input type="text" placeholder="Tu nombre">

<button>
DEJAR MI RECUERDO
</button>

</div>

</html>
